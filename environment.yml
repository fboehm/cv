name: cv2
# Portable, cross-platform environment for rendering cv.qmd with Quarto.
# No build strings or OS-specific packages, so it solves on Linux/macOS/Windows.
# (The original Windows-pinned export is kept as environment.windows-lock.yml.)
channels:
  - defaults
dependencies:
  - python=3.12
  - jupyter
  - ipykernel
  - nbclient
  - nbconvert
  - pyyaml
